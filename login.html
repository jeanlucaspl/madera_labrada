<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madera Labrada — Acceso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="brand">
      <img src="madera_labrada_logo-removebg-preview.png" alt="Madera Labrada" style="height:80px; margin-bottom:8px;">
      <p class="brand-sub">Sistema de Gestión</p>
    </div>

    <form id="form-login" autocomplete="off" novalidate>
      <div class="field">
        <label for="dni">DNI</label>
        <input type="text" id="dni" placeholder="12345678" required autocomplete="username" inputmode="numeric" maxlength="20">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <p id="login-err" class="err-msg" style="display:none"></p>
      <br>
      <button type="submit" class="btn-primary btn-full" id="btn-login">Ingresar</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="shared.js"></script>
  <script>
    // Si ya hay sesión activa, redirigir directamente
    sb.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) return
      const { data: p } = await sb.from('perfiles').select('rol,area,activo').eq('id', session.user.id).single()
      if (p && p.activo) redirigirSegunRol(p)
    })

    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault()
      const btn = document.getElementById('btn-login')
      const err = document.getElementById('login-err')
      err.style.display = 'none'
      btn.disabled = true
      btn.textContent = 'Ingresando...'

      const dni      = document.getElementById('dni').value.trim()
      const password = document.getElementById('password').value
      const email    = `${dni}@maderalabrada.pe`

      const { error } = await sb.auth.signInWithPassword({ email, password })
      if (error) {
        err.textContent = 'DNI o contraseña incorrectos.'
        err.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'Ingresar'
        return
      }

      const { data: { user } } = await sb.auth.getUser()
      const { data: p } = await sb.from('perfiles').select('rol,area,activo').eq('id', user.id).single()
      if (!p || !p.activo) {
        await sb.auth.signOut()
        err.textContent = 'Cuenta desactivada. Contactá al administrador.'
        err.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'Ingresar'
        return
      }

      redirigirSegunRol(p)
    })
  </script>
</body>
</html>
